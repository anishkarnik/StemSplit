services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - demucs_cache:/root/.cache/torch
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  demucs_cache:
